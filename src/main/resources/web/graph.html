<script>
const sources=[{id:"project",title:"Файлы",color:"#d8b36c"},{id:"shell",title:"Терминал",color:"#82aaca"},{id:"docs",title:"Документация",color:"#b5a0ce"},{id:"internet",title:"Сеть",color:"#78b6a8"},{id:"config",title:"Конфигурация",color:"#a2a6ae"},{id:"skills",title:"Скиллы",color:"#b59bd1"},{id:"agents",title:"Субагенты",color:"#bcc58a"}];

const gradients={project:["#e3bd76","#c99a58"],shell:["#91b7d5","#718fc4"],docs:["#c2acd8","#967cc4"],internet:["#86c5b5","#5aa9a0"],config:["#afb4bd","#838b9d"],skills:["#c7a5df","#d09bc3"],agents:["#ccd79a","#a5b86f"],reads:["#88c9b8","#5fa99d"],writes:["#e3bd76","#d69a64"],commands:["#91b7d5","#7799cc"],errors:["#ed8974","#d95c66"]};
const calls=new Map();let selected=null,detailKind="all",expandedEntry=null;
const positions=new Map();try{Object.entries(JSON.parse(localStorage.getItem("ai-explorer-graph-positions")||"{}")).forEach(([id,p])=>positions.set(id,p));}catch{}
let dragState=null,suppressClickUntil=0;
function positionOf(id,fallback){return positions.get(id)||fallback;}
function centerPosition(){return positionOf("center",{x:600,y:290});}
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const inputOf=tool=>tool.rawInput&&typeof tool.rawInput==="object"?tool.rawInput:{};
const pathOf=tool=>{const i=inputOf(tool);for(const k of["path","filePath","file_path"])if(typeof i[k]==="string"&&i[k].trim())return i[k];return null;};
const urlOf=tool=>{const i=inputOf(tool);for(const k of["url","uri","link","endpoint"])if(typeof i[k]==="string"&&i[k].startsWith("http"))return i[k];return null;};
const isAgent=tool=>/^agent/i.test((tool.title||"").trim())||"subagent_type"in inputOf(tool);
const isSkill=path=>{const v=(path||"").toLowerCase();return v.includes("/.kimi-code/skills/")||v.includes("/.claude/skills/")||v.includes("/.agents/skills/")||v.endsWith("/skill.md");};
function stationOf(tool){if(/^skill$/i.test((tool.title||"").trim())||"skill"in inputOf(tool))return"skills";if(urlOf(tool))return"internet";const p=pathOf(tool);if(p){if(isSkill(p))return"skills";const ext=p.split(".").pop().toLowerCase(),name=p.split("/").pop().toLowerCase();if(["md","mdx"].includes(ext))return"docs";if(["json","yml","yaml","toml","properties","xml","lock"].includes(ext)||[".gitignore",".editorconfig","dockerfile"].includes(name))return"config";return"project";}if(isAgent(tool))return"agents";if("command"in inputOf(tool)||/bash|shell|command/i.test(tool.title||""))return"shell";return"project";}

const shortPath=p=>p.split(/[\\/]/).filter(Boolean).slice(-2).join("/");

function matchingCalls(){const all=[...calls.values()];if(!selected)return all;if(selected.type==="source")return all.filter(c=>c.station===selected.id);return all.filter(c=>outcomeOf(c)===selected.id);}
function allowedSource(id){if(!selected)return true;if(selected.type==="source")return selected.id===id;return matchingCalls().some(c=>c.station===id);}
function allowedResult(id){if(!selected)return true;if(selected.type==="result")return selected.id===id;return matchingCalls().some(c=>outcomeOf(c)===id);}
function countLabel(n){return `${n} ${n===1?"действие":"действий"} за сессию`;}
function cardAnchor(pos,height,center){const dx=pos.x+110-center.x,dy=pos.y+height/2-center.y;if(Math.abs(dy)>Math.abs(dx)*.65)return{x:pos.x+110,y:pos.y+(dy>0?0:height),angle:dy>0?-Math.PI/2:Math.PI/2,radial:true};return{x:pos.x+(dx<0?220:0),y:pos.y+height/2,angle:dx<0?0:Math.PI,radial:true};}

function curve(a,b){const{c1,c2}=controls(a,b);return`M${a.x} ${a.y}C${c1.x} ${c1.y},${c2.x} ${c2.y},${b.x} ${b.y}`;}
function reverseCurve(a,b){const{c1,c2}=controls(a,b);return`M${b.x} ${b.y}C${c2.x} ${c2.y},${c1.x} ${c1.y},${a.x} ${a.y}`;}
function ribbon(a,b,width){const{c1,c2}=controls(a,b),offset=(p,v)=>p.radial?{x:p.x-Math.sin(p.angle)*v,y:p.y+Math.cos(p.angle)*v}:{x:p.x,y:p.y+v};const a0=offset(a,-width/2),a1=offset(a,width/2),b0=offset(b,-width/2),b1=offset(b,width/2),c10=offset(c1,-width/2),c11=offset(c1,width/2),c20=offset(c2,-width/2),c21=offset(c2,width/2);return`M${a0.x} ${a0.y}C${c10.x} ${c10.y},${c20.x} ${c20.y},${b0.x} ${b0.y}L${b1.x} ${b1.y}C${c21.x} ${c21.y},${c11.x} ${c11.y},${a1.x} ${a1.y}Z`;}
function flowWidth(count){return Math.min(52,3+count*.2);}
function cardLayout(items,counts,right=false){let y=right?80:55;return items.map((item,index)=>{const n=counts(item),ratio=n/Math.max(1,...items.map(counts)),height=n===0?42:ratio>.3?(right?112:126):ratio>.14?(right?88:94):42;const card={item,index,n,y,height};y+=height+(height>50?22:10);return card;});}
function render(){
 const all=[...calls.values()],filtered=matchingCalls(),now=Date.now(),resultColors={reads:"#78b6a8",writes:"#d8b36c",commands:"#82aaca",errors:"#e8654f"};
 const left=cardLayout(sources,s=>all.filter(c=>c.station===s.id).length),right=cardLayout(results,r=>all.filter(c=>outcomeOf(c)===r.id).length,true),center=centerPosition();
 const flowEntries=[...left.map(({item,index,n,y,height})=>{const pos=positionOf(item.id,{x:20,y}),anchor=cardAnchor(pos,height,center);return{id:item.id,angle:Math.atan2(anchor.y-center.y,anchor.x-center.x),width:flowWidth(n)};}),...right.map(({item,n,y,height})=>{const pos=positionOf(item.id,{x:960,y}),anchor=cardAnchor(pos,height,center);return{id:item.id,angle:Math.atan2(anchor.y-center.y,anchor.x-center.x),width:flowWidth(n)};})],flowAnchors=allocateFlowAnchors(flowEntries);let body=`<rect width="1200" height="600" fill="var(--bg)"/><defs><linearGradient id="comet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".32" stop-color="#fff" stop-opacity=".08"/><stop offset=".5" stop-color="#fff" stop-opacity=".65"/><stop offset=".68" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>${Object.entries(gradients).map(([id,pair])=>`<linearGradient id="flow-${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${pair[0]}"/><stop offset="1" stop-color="${pair[1]}"/></linearGradient>`).join("")}</defs><text x="20" y="27" fill="var(--faint)" font-size="10" letter-spacing="2">ИСТОЧНИКИ</text><text x="960" y="27" fill="var(--faint)" font-size="10" letter-spacing="2">РЕЗУЛЬТАТ</text>`;
 left.forEach(({item:s,index:i,n,y,height})=>{const cardPos=positionOf(s.id,{x:20,y}),center=centerPosition(),active=!selected||selected.type==="source"&&selected.id===s.id||selected.type==="result"&&matchingCalls().some(c=>c.station===s.id),a=cardAnchor(cardPos,height,center),b={...flowAnchors.get(s.id),radial:true},width=flowWidth(n);if(n)body+=`<path class="ribbon" d="${curve(a,b)}" fill="none" stroke-linecap="butt" stroke="url(#flow-${s.id})" stroke-width="${width}" opacity="${active?.62:.06}"/>`;const latest=Math.max(0,...all.filter(c=>c.station===s.id).map(c=>c.startedAt)),age=now-latest,duration=700*(.9+(i%3)*.05);if(age<1400){body+=`<rect class="pulse" opacity="0" data-age="${age}" data-duration="${duration}" data-width="${width}" data-motion="${reverseCurve(a,b)}" x="-144" y="${-width/2}" width="288" height="${width}" fill="url(#comet)" filter="blur(2.5px)"/>`;}});
 right.forEach(({item:r,index:i,n,y,height})=>{const cardPos=positionOf(r.id,{x:960,y}),center=centerPosition(),angle=Math.atan2(cardPos.y+height/2-center.y,cardPos.x+110-center.x),active=!selected||selected.type==="result"&&selected.id===r.id||selected.type==="source"&&matchingCalls().some(c=>outcomeOf(c)===r.id),a={...flowAnchors.get(r.id),radial:true},b=cardAnchor(cardPos,height,center),width=flowWidth(n);if(n)body+=`<path class="ribbon" d="${curve(a,b)}" fill="none" stroke-linecap="butt" stroke="url(#flow-${r.id})" stroke-width="${width}" opacity="${active?.62:.06}"/>`;const latest=Math.max(0,...all.filter(c=>outcomeOf(c)===r.id).map(c=>c.startedAt)),age=now-latest,duration=700*(.9+(i%3)*.05);if(age<1400){body+=`<rect class="pulse" opacity="0" data-age="${age}" data-duration="${duration}" data-width="${width}" data-motion="${curve(a,b)}" x="-144" y="${-width/2}" width="288" height="${width}" fill="url(#comet)" filter="blur(2.5px)"/>`;}});
 left.forEach(({item:s,n,y,height})=>{const cardPos=positionOf(s.id,{x:20,y}),enabled=allowedSource(s.id),arrival=now-Math.max(0,...all.filter(c=>c.station===s.id).map(c=>c.startedAt)),compact=height<50,pct=all.length?Math.round(n/all.length*100):0;body+=`<g class="source ${enabled?"active":"muted"} ${compact?"compact":""} ${selected?.type==="source"&&selected.id===s.id?"selected":""}" data-source="${s.id}" ${arrival<1400?`data-arrival="${arrival}"`:""} transform="translate(${cardPos.x} ${cardPos.y})"><rect class="card" width="220" height="${height}" rx="9"/><circle class="card-dot" cx="18" cy="${compact?21:27}" r="4" fill="${s.color}"/><text class="card-title" x="32" y="${compact?25:32}">${s.title}</text>${compact?`<text class="card-count" x="204" y="25">${enabled?n:"—"}</text>`:`<text class="card-count" x="16" y="72">${enabled?n:"—"}</text><text class="card-note" x="17" y="${height-15}">${pct}% сессии</text>`}</g>`;});
 const notes={reads:"файлы, документация, сеть",writes:"изменённых файлов",commands:"выполнено в терминале",errors:"завершились с ошибкой"};right.forEach(({item:r,n,y,height})=>{const cardPos=positionOf(r.id,{x:960,y}),enabled=allowedResult(r.id),arrival=now-Math.max(0,...all.filter(c=>outcomeOf(c)===r.id).map(c=>c.startedAt)),compact=height<50;body+=`<g class="result ${enabled?"active":"muted"} ${compact?"compact":""} ${selected?.type==="result"&&selected.id===r.id?"selected":""}" data-result="${r.id}" ${arrival<1400?`data-arrival="${arrival}"`:""} transform="translate(${cardPos.x} ${cardPos.y})"><rect class="card" width="220" height="${height}" rx="9"/><circle class="card-dot" cx="18" cy="${compact?21:25}" r="4" fill="${resultColors[r.id]}"/><text class="card-title" x="31" y="${compact?25:30}">${r.title}</text>${compact?`<text class="card-count" x="204" y="25">${enabled?n:"—"}</text>`:`<text class="card-count" x="16" y="69">${enabled?n:"—"}</text><text class="card-note" x="17" y="${height-14}">${notes[r.id]}</text>`}</g>`;});
 body+=`<g class="center-node" data-center="true"><circle class="center" cx="${center.x}" cy="${center.y}" r="70"/><text class="center-kimi" x="${center.x}" y="${center.y-16}">KIMI</text><text class="center-number" x="${center.x}" y="${center.y+20}">${filtered.length}</text><text class="center-label" x="${center.x}" y="${center.y+43}">действий</text></g>`;
 document.getElementById("map").innerHTML=body;document.getElementById("summary").textContent=selected?`Фильтр: ${titleOf(selected)}`:countLabel(all.length);
 document.querySelectorAll(".pulse").forEach(ray=>{const path=document.createElementNS("http://www.w3.org/2000/svg","path");path.setAttribute("d",ray.dataset.motion);const length=path.getTotalLength(),initialAge=Number(ray.dataset.age),duration=Number(ray.dataset.duration),started=performance.now();function move(now){const progress=(initialAge+now-started)/duration;if(progress>=1){ray.setAttribute("opacity","0");return;}const distance=Math.max(0,progress)*length,point=path.getPointAtLength(distance),next=path.getPointAtLength(Math.min(length,distance+1));const angle=Math.atan2(next.y-point.y,next.x-point.x)*180/Math.PI;ray.setAttribute("x",point.x-144);ray.setAttribute("y",point.y-Number(ray.dataset.width)/2);ray.setAttribute("transform",`rotate(${angle} ${point.x} ${point.y})`);ray.setAttribute("opacity",String(Math.max(0,Math.sin(progress*Math.PI))*.6));requestAnimationFrame(move);}requestAnimationFrame(move);});
 document.querySelectorAll("[data-arrival]").forEach(card=>card.animate([{filter:"brightness(1)"},{filter:"brightness(1.65)"},{filter:"brightness(1)"}],{duration:550,delay:Math.max(0,625-Number(card.dataset.arrival)),fill:"none"}));

}
function svgPoint(event){const svg=document.getElementById("map"),point=svg.createSVGPoint();point.x=event.clientX;point.y=event.clientY;return point.matrixTransform(svg.getScreenCTM().inverse());}
document.getElementById("map").addEventListener("pointerdown",event=>{const node=event.target.closest(".source,.result,.center-node");if(!node||event.button!==0)return;const type=node.hasAttribute("data-center")?"center":node.hasAttribute("data-source")?"source":"result",id=type==="center"?"center":node.dataset[type];const transform=node.transform?.baseVal.consolidate()?.matrix,fallback=type==="center"?{x:600,y:290}:{x:transform?.e??20,y:transform?.f??0},current=positionOf(id,fallback),point=svgPoint(event);dragState={id,current,dx:point.x-current.x,dy:point.y-current.y,startX:event.clientX,startY:event.clientY,moved:false};node.classList.add("dragging");event.preventDefault();});
document.getElementById("map").addEventListener("pointermove",event=>{if(!dragState)return;const point=svgPoint(event);if(Math.hypot(event.clientX-dragState.startX,event.clientY-dragState.startY)>3)dragState.moved=true;if(!dragState.moved)return;positions.set(dragState.id,{x:point.x-dragState.dx,y:point.y-dragState.dy});render();});
document.getElementById("map").addEventListener("pointerup",()=>{if(!dragState)return;if(dragState.moved){suppressClickUntil=Date.now()+250;localStorage.setItem("ai-explorer-graph-positions",JSON.stringify(Object.fromEntries(positions)));}dragState=null;});
function titleOf(value){return(value.type==="source"?sources:results).find(x=>x.id===value.id)?.title||"";}
function choose(type,id){if(Date.now()<suppressClickUntil)return;if(selected?.type===type&&selected.id===id)showDetails();else{selected={type,id};detailKind="all";document.getElementById("details").hidden=true;render();}}
function showDetails(){if(!selected)return;expandedEntry=null;renderDetails();document.getElementById("details").hidden=false;}
function detailCalls(){let own=matchingCalls();if(detailKind!=="all")own=own.filter(c=>outcomeOf(c)===detailKind);return own;}
function renderDetails(){
 const own=detailCalls(),groups=new Map();for(const call of own){const key=call.path||call.url||detailLabel(call),label=call.path?shortPath(call.path):call.url?hostOf(call.url):detailLabel(call);const item=groups.get(key)||{key,label,path:call.path,url:call.url,calls:[]};item.calls.push(call);groups.set(key,item);}
 document.getElementById("details-title").textContent=titleOf(selected);document.getElementById("details-summary").textContent=countLabel(own.length);
 const chips=[{id:"all",title:"Все"},{id:"reads",title:"Чтения"},{id:"writes",title:"Правки"},{id:"commands",title:"Команды"},{id:"errors",title:"Ошибки"}];document.getElementById("chips").innerHTML=chips.map(c=>`<button class="chip ${detailKind===c.id?"active":""}" data-kind="${c.id}">${c.title}</button>`).join("");
 document.querySelectorAll("[data-kind]").forEach(b=>b.addEventListener("click",()=>{detailKind=b.dataset.kind;expandedEntry=null;renderDetails();}));
 const items=[...groups.values()].sort((a,b)=>(b.calls.at(-1)?.startedAt||0)-(a.calls.at(-1)?.startedAt||0));if(expandedEntry===null&&items.length)expandedEntry=items[0].key;
 document.getElementById("entries").innerHTML=items.length?items.map(item=>`<button class="entry" data-entry="${esc(item.key)}"><span class="entry-title" title="${esc(item.key)}">${esc(item.label)}</span><span class="entry-count">${item.calls.length}</span><span class="entry-time">${time(item.calls.at(-1)?.startedAt)}</span></button>${expandedEntry===item.key?`<div class="history">${item.path||item.url?`<button class="chip" data-open="${esc(item.path||item.url)}">Открыть ${item.path?"файл":"сайт"}</button>`:""}${item.calls.slice().reverse().map(call=>`<div class="history-row"><span>${time(call.startedAt)}</span><span>${esc(call.station==="shell"&&call.tool.rawInput?.command?call.tool.rawInput.command:labelOf(call.tool))}</span><span>${duration(call)}</span></div>`).join("")}</div>`:""}`).join(""):`<div class="empty">Нет действий для этого фильтра</div>`;
 document.querySelectorAll("[data-entry]").forEach(b=>b.addEventListener("click",()=>{expandedEntry=expandedEntry===b.dataset.entry?null:b.dataset.entry;renderDetails();}));
 document.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>{const value=b.dataset.open;send(value.startsWith("http")?"link.open":"file.open",value.startsWith("http")?{url:value}:{path:value});}));
}
function time(value){return value?new Date(value).toLocaleTimeString(window.AI_EXPLORER_LOCALE==="en"?"en-US":"ru-RU",{hour:"2-digit",minute:"2-digit",second:"2-digit"}):"—";}
function duration(call){if(!call.endedAt)return"…";const ms=Math.max(0,call.endedAt-call.startedAt);return ms<1000?`${ms} ${window.AI_EXPLORER_LOCALE==="en"?"ms":"мс"}`:`${(ms/1000).toFixed(1)} ${window.AI_EXPLORER_LOCALE==="en"?"s":"с"}`;}
function send(type,payload={}){window.AiExplorerHost?.send(JSON.stringify({type,...payload}));}
document.getElementById("reset").addEventListener("click",()=>{selected=null;document.getElementById("details").hidden=true;render();});
document.getElementById("map").addEventListener("click",event=>{if(!event.target.closest(".source,.result")){selected=null;document.getElementById("details").hidden=true;render();}});
document.getElementById("details-close").addEventListener("click",()=>document.getElementById("details").hidden=true);
window.AiExplorer={receive(event){if(event.type==="theme")document.documentElement.dataset.theme=event.dark?"dark":"light";if(event.type==="history.loading"){calls.clear();selected=null;document.getElementById("details").hidden=true;render();return;}if(event.type!=="tool.updated")return;const u=event.update||{};if(!u.toolCallId)return;const previous=calls.get(u.toolCallId),tool={...previous?.tool,...u},now=Date.now();calls.set(u.toolCallId,{id:u.toolCallId,tool,station:previous?.station||stationOf(tool),path:pathOf(tool),url:urlOf(tool),status:u.status||previous?.status||"in_progress",startedAt:previous?.startedAt||now,endedAt:u.status&&u.status!=="in_progress"?now:previous?.endedAt});render();if(!document.getElementById("details").hidden)renderDetails();}};
window.AiExplorerHost=window.AiExplorerHost||{send(){}};render();send("ui.ready");
</script></body></html>
