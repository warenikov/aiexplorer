<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Explorer — MCP</title>
<style>
:root{color-scheme:dark;--bg:#1e1f22;--raised:#2b2d30;--hover:#313438;--text:#bcbec4;--secondary:#9da0a8;--faint:#6f737a;--border:#393b40;--strong:#4b4d52;--accent:#d68c67;--danger:#e8654f;--accent-bg:#35312e}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:var(--bg);color:var(--text);font:13px "JetBrains Mono","SFMono-Regular",Consolas,monospace}button,input,select,textarea{font:inherit}button{color:inherit;cursor:pointer}.app{display:flex;flex-direction:column;height:100%}.brand{height:58px;flex-shrink:0;display:flex;align-items:center;padding:0 14px;font-weight:650}.brand span{flex:1}.icon{border:0;background:transparent;color:var(--secondary);padding:7px}.search{margin:4px 12px 10px;height:35px;padding:0 10px;border:1px solid var(--border);border-radius:3px}.search input{width:100%;height:100%;border:0;outline:0;color:var(--text);background:transparent}.tree{flex:1;min-height:0;overflow:auto;padding:0 7px 12px}.group{margin-bottom:10px}.group-row,.server-row{width:100%;display:flex;align-items:center;gap:8px;padding:10px 9px;border:1px solid transparent;border-radius:4px;background:transparent;text-align:left}.group-row:hover,.server-row:hover{background:var(--hover)}.twisty{color:var(--secondary)}.title{flex:1}.meta{color:var(--faint);font-size:9px}.server.open>.server-row{background:var(--accent-bg);border-color:var(--strong)}.server.open>.server-row .title{color:var(--accent)}.disabled>.server-row .title{color:var(--faint)}.servers{margin-left:14px;border-left:1px solid var(--border);padding-left:5px}.servers[hidden],.editor[hidden]{display:none}.add{margin:5px 0 10px 32px;padding:6px 9px;border:1px solid var(--strong);border-radius:3px;background:transparent;color:var(--secondary);font-size:10px}.add:hover{color:var(--accent);border-color:var(--accent)}.editor{margin:3px 0 10px 23px;padding:12px;border:1px solid var(--border);border-radius:4px;background:var(--raised)}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.field>span{color:var(--secondary);font-size:10px}.field input,.field select,.field textarea{width:100%;padding:7px 8px;border:1px solid var(--strong);border-radius:3px;outline:0;color:var(--text);background:var(--bg);font-size:11px}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}.field textarea{min-height:65px;resize:vertical}.check{display:flex;gap:7px;align-items:center;margin:9px 0;color:var(--secondary);font-size:11px}.check input{accent-color:var(--accent)}.hint{color:var(--faint);font-size:9px;line-height:1.5}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.actions button{padding:7px 10px;border:1px solid var(--strong);border-radius:3px;background:transparent;color:var(--text);font-size:10px}.actions .save{border-color:var(--accent);color:var(--accent)}.actions .delete{color:var(--danger);margin-left:auto}.status{min-height:18px;margin-top:9px;color:var(--accent);font-size:10px}.empty{padding:25px 12px;color:var(--faint);text-align:center}::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#55575c;border:3px solid transparent;border-radius:5px;background-clip:padding-box}
</style></head>
<body><div class="app"><header class="brand"><span>MCP</span><button class="icon" id="refresh" title="Обновить">↻</button></header><label class="search"><input id="search" placeholder="Поиск MCP-серверов" autocomplete="off"></label><div class="tree" id="tree"></div></div>
<script>
let groups=[],openGroups=new Set(["global","project"]),openEditors=new Set(),messages=new Map();
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
function send(type,payload={}){window.AiExplorerHost?.send(JSON.stringify({type,...payload}));}
function render(){
 const query=document.getElementById("search").value.trim().toLowerCase();
 document.getElementById("tree").innerHTML=groups.map(group=>{
  const servers=(group.children||[]).filter(s=>s.title.toLowerCase().includes(query));if(query&&!servers.length)return"";
  return `<section class="group"><button class="group-row" data-group="${group.scope}"><span class="twisty">${openGroups.has(group.scope)?"▼":"▶"}</span><span class="title">${esc(group.title)}</span><span class="meta">${servers.length}</span></button><div class="servers" ${openGroups.has(group.scope)?"":"hidden"}>${servers.map(serverHtml).join("")}<button class="add" data-add="${group.scope}">+ Добавить сервер</button>${group.path?`<button class="add" data-json="${esc(group.path)}">Дополнительно → JSON</button>`:""}</div></section>`;
 }).join("");bind();
}
function serverHtml(server){
 const id=server.serverId,open=openEditors.has(id),c=server.config||{};
 return `<section class="server ${open?"open":""} ${c.enabled===false?"disabled":""}"><button class="server-row" data-server="${esc(id)}"><span class="twisty">${open?"▼":"▶"}</span><span class="title">${esc(server.title)}</span><span class="meta">${esc(c.transport||"MCP")}</span></button>${open?editorHtml(server):""}</section>`;
}
function editorHtml(server){
 const c=server.config||{},stdio=c.transport==="stdio";
 return `<form class="editor" data-form="${esc(server.serverId)}" data-old="${esc(server.title)}" data-scope="${server.scope}"><label class="field"><span>Название</span><input name="name" required value="${esc(server.title)}"></label><label class="field"><span>Тип подключения</span><select name="transport"><option value="stdio" ${stdio?"selected":""}>stdio · локальная команда</option><option value="http" ${c.transport==="http"?"selected":""}>HTTP</option><option value="sse" ${c.transport==="sse"?"selected":""}>SSE</option></select></label><div data-transport-fields>${stdio?stdioFields(c):httpFields(c)}</div><label class="check"><input type="checkbox" name="enabled" ${c.enabled!==false?"checked":""}> Включён</label><label class="check"><input type="checkbox" name="deferred" ${c.deferred?"checked":""}> Загружать инструменты по требованию</label><div class="actions"><button class="save" type="submit">Сохранить</button><button type="button" data-remove>Удалить</button></div><div class="status">${esc(messages.get(server.serverId)||"")}</div></form>`;
}
function stdioFields(c){return `<label class="field"><span>Команда</span><input name="command" required value="${esc(c.command||"")}" placeholder="npx"></label><label class="field"><span>Аргументы · один на строку</span><textarea name="args" placeholder="Пусто — сохранить текущие аргументы"></textarea></label><label class="field"><span>Рабочая директория</span><input name="cwd" value="${esc(c.cwd||"")}"></label><label class="field"><span>Переменные · KEY=value, одна на строку</span><textarea name="env" placeholder="Пусто — сохранить текущие значения"></textarea><small class="hint">Существующие значения не загружаются и не отображаются.</small></label>`;}
function httpFields(c){return `<label class="field"><span>URL</span><input name="url" type="url" value="${esc(c.url||"")}" placeholder="${c.hiddenUrl?"URL содержит скрытые данные — введите заново для замены":"https://example.com/mcp"}"></label><label class="field"><span>Имя переменной с bearer-токеном</span><input name="bearerTokenEnvVar" value="${esc(c.bearerTokenEnvVar||"")}" placeholder="MCP_TOKEN"></label>`;}
function bind(){
 document.querySelectorAll("[data-group]").forEach(b=>b.addEventListener("click",()=>{const id=b.dataset.group;if(openGroups.has(id))openGroups.delete(id);else openGroups.add(id);render();}));
 document.querySelectorAll("[data-server]").forEach(b=>b.addEventListener("click",()=>{const id=b.dataset.server;if(openEditors.has(id))openEditors.delete(id);else openEditors.add(id);render();}));
 document.querySelectorAll("[data-add]").forEach(b=>b.addEventListener("click",()=>{const scope=b.dataset.add,id=`${scope}#new`;openEditors.add(id);const group=groups.find(g=>g.scope===scope);group.children=group.children||[];if(!group.children.some(s=>s.serverId===id))group.children.push({title:"",serverId:id,scope,config:{transport:"stdio",enabled:true}});render();}));
 document.querySelectorAll("[data-json]").forEach(b=>b.addEventListener("click",()=>send("file.open",{path:b.dataset.json})));
 document.querySelectorAll("[data-form]").forEach(form=>{
  form.querySelector("[name=transport]").addEventListener("change",()=>{const server=findServer(form.dataset.form);server.config={...server.config,transport:form.elements.transport.value};render();});
  form.addEventListener("submit",event=>{event.preventDefault();const f=form.elements;send("mcp.save",{scope:form.dataset.scope,oldName:form.dataset.old,name:f.name.value,transport:f.transport.value,command:f.command?.value||"",url:f.url?.value||"",args:f.args?.value||"",cwd:f.cwd?.value||"",env:f.env?.value||"",bearerTokenEnvVar:f.bearerTokenEnvVar?.value||"",enabled:f.enabled.checked,deferred:f.deferred.checked});});
  form.querySelector("[data-remove]").addEventListener("click",()=>{if(confirm(window.AI_EXPLORER_LOCALE==="en"?`Delete MCP server "${form.dataset.old}"?`:`Удалить MCP-сервер «${form.dataset.old}»?`))send("mcp.delete",{scope:form.dataset.scope,name:form.dataset.old});});
 });
}
function findServer(id){for(const group of groups){const server=(group.children||[]).find(s=>s.serverId===id);if(server)return server;}return null;}
document.getElementById("search").addEventListener("input",render);document.getElementById("refresh").addEventListener("click",()=>send("resources.refresh"));
window.AiExplorer={receive(event){if(event.type==="theme")document.documentElement.dataset.theme=event.dark?"dark":"light";if(event.type==="resources"){groups=event.nodes||[];render();}if(event.type==="mcp.result"){if(event.serverId)messages.set(event.serverId,event.message);send("resources.refresh");}}};
window.AiExplorerHost=window.AiExplorerHost||{send(){}};render();send("ui.ready");
</script></body></html>
